name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - name: Set up Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run CPU tests
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: uv run pytest
