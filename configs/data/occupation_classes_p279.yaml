rule_several_occupations: A person gets the class that the largest number of their distinct occupations
  belong to. Ties are broken by the order of the classes below (earlier wins). Occupations not listed
  here count as 'other'; a person gets 'other' only if none of their occupations is mapped.
class_order: [natural_sciences, medicine, engineering_technology, humanities_social_sciences, literature,
  music, film_tv_performing, visual_arts_design, sports, journalism_media, law, religion, military_security,
  business, activism_civil_society, nobility_royalty, politics_government, education]
method: 'source: hand = copied from configs/data/occupation_classes.yaml, which always wins. source: p279
  = follow P279 upward, at most 1 step(s), to the nearest hand-labelled occupation; several at the same
  level: most of one class wins, ties to the class listed first in class_order. Umbrella occupations (GENERIC_ANCHORS
  in the script) are not used. Occupations not listed here count as ''other''.'
